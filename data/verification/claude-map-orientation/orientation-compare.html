<script>
const ROT=11;// 度、反時計回り（本作の設定と同じ）
// 初期の位置合わせ（目分量）。ページ上で本作の層をなぞって動かし、滑車で大きさを変え、[ と ] で角度を 1 度ずつ変えられる
// 回転と拡大の軸は本作の写しの鹿児島（画素 263,440）。角度を変えても鹿児島は動かず、津軽側の傾きだけが変わる
const PIVOT=[290,403],REF_KAGO=[215,690];let tx=REF_KAGO[0]-PIVOT[0],ty=REF_KAGO[1]-PIVOT[1],k=1.88,rot=ROT;
const gi=document.getElementById('g'),ang=document.getElementById('ang');
const apply=()=>{gi.style.transformOrigin=`${PIVOT[0]}px ${PIVOT[1]}px`;gi.style.transform=`translate(${tx}px,${ty}px) scale(${k}) rotate(${-rot}deg)`;ang.textContent=`　回転 ${rot} 度（[ ] で変更）、大きさ ${k.toFixed(2)}（滑車）、なぞって移動`;};
const ov=document.getElementById('ov');let drag=null;
ov.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,tx,ty};ov.setPointerCapture(e.pointerId);});
ov.addEventListener('pointermove',e=>{if(!drag)return;tx=drag.tx+(e.clientX-drag.x);ty=drag.ty+(e.clientY-drag.y);apply();});
ov.addEventListener('pointerup',()=>{drag=null;});
ov.addEventListener('wheel',e=>{e.preventDefault();const r=ov.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,f=Math.exp(-e.deltaY*.002);tx=mx-(mx-tx)*f;ty=my-(my-ty)*f;k*=f;apply();},{passive:false});
addEventListener('keydown',e=>{if(e.key==='[')rot-=1;else if(e.key===']')rot+=1;else return;apply();});
const a=document.getElementById('a'),av=document.getElementById('av');const set=()=>{gi.style.opacity=a.value/100;av.textContent=a.value+'%';};a.oninput=set;set();apply();
</script></body></html>
