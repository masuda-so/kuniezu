name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax, storage and territory checks
        run: node tools/checks/offline.cjs
      - name: Folder and ownership checks
        run: |
          node tools/checks/organization.cjs
          node tools/checks/work-policy.cjs
          node tools/work/build-catalog.cjs --requests-only --check
      - name: Infrastructure checks
        run: node tools/checks/infrastructure.cjs
      - name: County paint rules and counts
        run: node tools/checks/county-map.cjs
      - name: Canonical road source and readiness
        run: |
          node tools/checks/road-vector-loading.cjs
          node tools/checks/road-vectors.cjs
      - name: Secret scan
        run: node tools/checks/secret-scan.cjs
      - name: Historical records and authority identities
        run: |
          node tools/checks/sekigahara-motion.cjs
          node tools/checks/battle-event-classification.cjs
          node tools/checks/evidence-store.cjs
          node tools/checks/location-store.cjs
          node tools/checks/control-ledger.cjs
          node tools/checks/owner-timeline.cjs
          node tools/checks/history-index.cjs
          python3 tools/checks/history-sqlite.py
          python3 tools/checks/history-sqlite-inputs.py
          python3 tools/checks/history-cube.py
      - name: Battle atlas source and framing
        run: |
          node tools/checks/battle-conflicts.cjs
          node tools/checks/local-battle-scene.cjs
          node tools/checks/local-dem.cjs
          node tools/checks/nagakute-local-scene.cjs
          node tools/checks/atlas-regressions.cjs
          node tools/checks/battle-viewport.cjs
          node tools/checks/battle-relief.cjs
          node tools/checks/battle-initial-views.cjs
          node tools/checks/battle-atlas-detail.cjs
          node tools/checks/battle-counter-density.cjs
          node tools/checks/battle-label-cards.cjs
          node tools/checks/battle-mode-labels.cjs
          node tools/checks/battle-rivers.cjs
      - name: Asset version stamps
        run: node tools/build/stamp-assets.cjs --check
      # 地図の配信物は追跡しない。正本 kuniezu/map から作れること、年代別の差分が当たることを確かめる（陰影は除く）。
      - name: Build the map from its source
        run: node tools/map/build-map.cjs --no-previews
      - name: Raster map checks
        run: node --max-old-space-size=8000 tools/checks/raster-map.cjs
      # 地図を作り直した後の画素数の集計が、コミット済みのものと一致すること（正本を変えた PR で集計の更新漏れを防ぐ）。
      - name: Committed pixel audit matches the source
        run: git diff --exit-code -- data/audits/raster-province-pixels.json
      - name: Dated map edit checks
        run: node --max-old-space-size=8000 tools/checks/province-edits.cjs
      - name: Local province reconstruction safety
        run: node tools/checks/province-runs.cjs
      - name: Hachirogata water reconstruction
        run: node tools/checks/hachirogata-water.cjs
      - name: Katori water and shoreline masks
        run: node tools/checks/katori-water.cjs
