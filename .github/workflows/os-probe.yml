name: OS probe

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Install Dependencies
      run: uv sync --locked
    - name: Versions
      run: |
        uv run python - <<'PY'
        import platform, sys
        import numpy, pyproj, shapely
        from pyproj import Transformer
        print("python", sys.version)
        print("libc", platform.libc_ver(), platform.platform())
        print("numpy", numpy.__version__, "shapely", shapely.__version__, "geos", shapely.geos_version_string)
        print("pyproj", pyproj.__version__, "proj", pyproj.proj_version_str, "data", pyproj.datadir.get_data_dir())
        print("network", pyproj.network.is_network_enabled())
        for a, b in (("OGC:CRS84", "EPSG:6677"), ("EPSG:6677", "OGC:CRS84")):
            t = Transformer.from_crs(a, b, always_xy=True)
            print(a, "->", b, "|", t.description, "|", t.definition)
        t = Transformer.from_crs("OGC:CRS84", "EPSG:6677", always_xy=True)
        print("sample", repr(t.transform(139.76, 35.68)))
        PY
        uv pip list 2>/dev/null | grep -i -E "numpy|shapely|pyproj|pillow"
    - name: Failing test
      run: uv run pytest tests/test_vector_era_sources.py -q -p no:cacheprovider
    - name: Size of the difference
      if: always()
      run: |
        uv run python - <<'PY'
        import shapely
        from shapely.geometry import shape
        from tests import test_vector_era_sources as t
        from pyproj import Transformer
        fwd = Transformer.from_crs("OGC:CRS84", "EPSG:6677", always_xy=True)
        back = Transformer.from_crs("EPSG:6677", "OGC:CRS84", always_xy=True)
        masks = t.read("kuniezu/map/physical/shoreline_masks.geojson")
        suppress = shapely.union_all([shapely.transform(shapely.transform(shape(f["geometry"]), fwd.transform, interleaved=False).buffer(f["properties"]["bufferMetres"]), back.transform, interleaved=False) for f in masks["features"]])
        print("suppress wkb sha", __import__("hashlib").sha256(shapely.to_wkb(suppress)).hexdigest()[:16])
        for year in (1560, 1584):
            rows = [f for f in t.surfaces()[2] if t.active(f, year)]
            actual = shapely.union_all([shape(f["geometry"]) for f in rows])
            expected = t.land_at(year).boundary.difference(suppress)
            d = actual.symmetric_difference(expected)
            parts = list(getattr(d, "geoms", [d]))
            print(year, "equals", actual.equals(expected), "symdiff len", d.length, "parts", len(parts),
                  "max part", max((p.length for p in parts), default=0), "hausdorff", actual.hausdorff_distance(expected),
                  "len actual", actual.length, "len expected", expected.length)
        PY
