name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Node.js for vector build tests
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Install Dependencies
      run: |
        uv sync --locked
    - name: Run Tests
      run: |
        uv run pytest
    # GeoDjango (docs/architecture/replatform-plan.md, stage 7). The tests
    # above ran before the GIS libraries are installed, so they also show that
    # the default settings and the static export need none.
    - name: Install the GIS libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gdal-bin libsqlite3-mod-spatialite
    - name: Run GIS Tests
      run: |
        uv run pytest --ds=config.settings.geo tests_geo -s
    - name: Migrate a SpatiaLite database
      env:
        DJANGO_SETTINGS_MODULE: config.settings.geo
        GEO_DATABASE_URL: spatialite:///${{ runner.temp }}/geo.sqlite3
      run: |
        uv run python manage.py migrate --verbosity 1

