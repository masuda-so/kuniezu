name: Offline checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  checks:
    name: Offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Syntax, storage and territory checks
        run: node tools/checks/offline.cjs
      - name: Folder and ownership checks
        run: node tools/checks/organization.cjs
      - name: Infrastructure checks
        run: node tools/checks/infrastructure.cjs
      - name: Secret scan
        run: node tools/checks/secret-scan.cjs
      - name: Historical records and authority identities
        run: |
          node tools/checks/battle-event-classification.cjs
          node tools/checks/evidence-store.cjs
          node tools/checks/location-store.cjs
          node tools/checks/history-index.cjs
          python3 tools/checks/history-sqlite.py
          python3 tools/checks/history-sqlite-inputs.py
      - name: Asset version stamps
        run: node tools/build/stamp-assets.cjs --check
      # 地図の配信物は追跡しない。正本 game/map_data から作れること、年代別の差分が当たることを確かめる（陰影は除く）。
      - name: Build the map from its source
        run: node tools/map/build-map.cjs
      - name: Raster map checks
        run: node --max-old-space-size=8000 tools/checks/raster-map.cjs
      - name: Dated map edit checks
        run: node --max-old-space-size=8000 tools/checks/province-edits.cjs
      - name: Katori water and shoreline masks
        run: node tools/checks/katori-water.cjs
