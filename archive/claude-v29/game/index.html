<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}

</style></head><body>
<title>国絵図</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 配置図の一枚絵：陰影の地形に淡い領国色、青海波の海。札は漆と金。左に年表、地図は眺めるもの */
:root{
  --lac:rgba(19,15,10,.92); --lac2:#211a12; --lac3:#2c2318; --rule:#6b5530; --rule2:#3c3020;
  --gold:#d9b866; --gold2:#f2dc9c; --paper:#f3e8cc; --muted:#b8a785; --dim:#8a7b60;
  --red:#e2735b; --green:#8fc796; --sea:#1c3157;
  --f-mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--sea);color:var(--paper);font-family:var(--f-body);font-size:14px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
small{font-size:12px;color:var(--muted)}
h2,h3,h4,p{margin:0}
#app{position:fixed;inset:0;overflow:hidden}
canvas#base,canvas#top{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas#top{touch-action:none;cursor:grab}
.frame{background:var(--lac);border:1px solid var(--rule);border-radius:4px;box-shadow:inset 0 0 0 3px rgba(19,15,10,.9),inset 0 0 0 4px rgba(217,184,102,.3),0 10px 30px rgba(0,0,0,.45)}
#app:not([data-mode="game"]) .gonly{display:none!important}

/* 年月と時の操作 */
#era{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:14px;z-index:4;padding:10px 14px 10px 18px;display:flex;align-items:center;gap:16px;width:288px}
#eraTxt{display:flex;flex-direction:column;line-height:1.1;flex:1;min-width:0}
#eraTxt .e1{font-family:var(--f-mincho);font-weight:800;font-size:25px;letter-spacing:.06em;color:var(--gold2)}
#eraTxt .e2{font-family:var(--f-mincho);font-weight:700;font-size:15px;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
#eraTxt .e3{font-size:11.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
#era{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:10px 12px 10px 18px}
.pp{width:42px;height:42px;border-radius:50%;border:1px solid #f2dc9c;background:linear-gradient(180deg,#e9cc80,#c9a04e);color:#1d1407;font-size:15px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pp.on{background:var(--lac2);color:var(--gold2);border-color:var(--rule)}
.mult{grid-column:1/-1;display:flex;gap:3px}
.mult button{flex:1;height:26px;padding:0;border:1px solid var(--rule2);border-radius:3px;background:var(--lac2);font-size:11px;letter-spacing:-.02em;color:var(--muted);font-variant-numeric:tabular-nums}
.mult button.cur{border-color:var(--gold);color:var(--gold2)}
.mult button[aria-pressed="true"]{background:linear-gradient(180deg,#e9cc80,#c9a04e);color:#1d1407;border-color:#f2dc9c;font-weight:700}
.hstate{cursor:pointer}
.hlist{display:flex;flex-direction:column;gap:6px;margin-top:6px}.hlist div{padding:6px 10px;border-left:2px solid var(--rule);background:rgba(0,0,0,.15)}.hlist b{font-family:var(--f-mincho)}.hlist small{display:block;color:var(--dim)}
.hmeter{height:8px;border-radius:4px;background:rgba(243,232,204,.12);overflow:hidden;margin:6px 0 2px}.hmeter i{display:block;height:100%;background:linear-gradient(90deg,#8d6a2a,#e2c173)}
.tline2{margin:10px 0 0;padding:6px 9px;border-left:3px solid #8a7a52;background:rgba(0,0,0,.18)}.tline2 b{font-family:var(--f-mincho)}.tline2 em{font-style:normal;margin-left:8px;color:var(--gold2);font-size:12px}.tline2 small{display:block;font-size:11.5px;color:var(--muted)}
.yline{display:flex;flex-direction:column;gap:6px;margin:10px 0}.yline>div{padding:6px 9px;border:1px solid var(--rule2);border-radius:3px;background:rgba(0,0,0,.18)}.yline b{font-family:var(--f-mincho);font-size:13.5px}.yline small{display:block;font-size:11.5px;color:var(--muted)}.yline .yd{color:var(--dim)}.yk{font-style:normal;display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;margin-right:6px;background:#c9a04e;color:#1d1407;border-radius:2px;font-size:11px;transform:rotate(0)}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule2)}.tgl small{display:block;color:var(--dim)}

/* 自家 */
#me{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:14px;z-index:4;display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 340px)}
#me b{display:block;font-family:var(--f-mincho);font-weight:800;font-size:16px;line-height:1.2}
#me small{font-variant-numeric:tabular-nums}
.hstate{font-size:12px;padding:2px 9px;border-radius:10px;border:1px solid var(--green);color:var(--green)}
.hstate.chg{border-color:var(--red);color:#f3b4a4}
.pols,.pcts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.pcts{grid-template-columns:repeat(3,1fr)}
.pol{padding:7px 4px;border:1px solid var(--rule2);border-radius:3px;background:var(--lac2);font-family:var(--f-mincho);font-size:14px}.pol.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(217,184,102,.3),rgba(217,184,102,.1));color:var(--gold2)}
#drawer h4{font-family:var(--f-mincho);font-size:13px;letter-spacing:.1em;color:var(--gold);margin:4px 0 2px}#drawer h4 small{font-family:var(--f-body);letter-spacing:0;font-size:11px;color:var(--dim);font-weight:500;margin-left:6px}
.tacs,.dopts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.dopts{grid-template-columns:repeat(3,1fr)}.act.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(217,184,102,.24),rgba(217,184,102,.08))}
.srcs{display:flex;flex-direction:column;gap:4px;max-height:28vh;overflow:auto}.src{display:flex;gap:9px;align-items:center;padding:6px 10px;border:1px solid var(--rule2);border-radius:3px;background:var(--lac2);cursor:pointer}.src input{accent-color:var(--gold);width:16px;height:16px}.src small{display:block}
.est{margin-top:14px;padding:11px 13px;border-radius:3px;background:var(--lac2);border:1px solid var(--rule2)}.kv{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 12px;align-items:baseline;font-variant-numeric:tabular-nums}.kv span{color:var(--muted);font-size:12.5px}.kv b{font-family:var(--f-mincho);font-size:17px}.red{color:var(--red)}.gold{color:var(--gold2)}
.mbox.attack,.mbox.envoy{width:min(640px,100%)}
/* 年表 */
#chron{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:106px;bottom:16px;width:288px;z-index:3;padding:12px 12px 10px 14px;display:flex;flex-direction:column;min-height:0}
#chron h3{font-family:var(--f-mincho);font-size:14px;letter-spacing:.2em;color:var(--gold);margin-bottom:8px}
#chron h4{font-family:var(--f-mincho);font-size:12.5px;letter-spacing:.14em;color:var(--dim);margin:10px 0 4px;border-top:1px solid var(--rule2);padding-top:8px}
.clist2{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:9px;scrollbar-width:thin;scrollbar-color:var(--rule2) transparent;padding-right:4px}
.ci{display:flex;gap:9px;align-items:flex-start}
.ci time{display:block;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.ci b{display:block;font-family:var(--f-mincho);font-weight:800;font-size:14.5px;color:var(--gold2);line-height:1.35}
.ci p{font-size:12.5px;line-height:1.65;color:#e2d6b6}
.ci.big b{font-size:16px}
.ci.off{opacity:.55}.ci em{font-style:normal;font-size:11.5px;color:var(--red)}
.ci .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none;margin:6px 11px 0 11px}
.ci>div{min-width:0}
.nx{font-size:12.5px;color:var(--muted);display:flex;gap:8px}
.nx time{color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
/* 大きな出来事 */
#big{position:absolute;left:50%;top:20%;transform:translateX(-50%);z-index:8;width:min(560px,calc(100% - 32px));padding:18px 22px;pointer-events:none;opacity:0}
#big .bmain{display:flex;gap:18px;align-items:center}#big .bstk{margin-top:12px;padding-top:10px;border-top:1px solid rgba(201,168,92,.35);display:flex;flex-direction:column;gap:6px}#big .bsh{font-size:11px;opacity:.75}#big .bst{display:flex;gap:10px;align-items:center;opacity:.85}#big .bst b{font-family:var(--f-mincho);font-size:16px;color:var(--gold2);margin-left:8px}
#big.in{animation:bin .5s ease forwards}#big.out{animation:bout .5s ease forwards}
@keyframes bin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes bout{from{opacity:1}to{opacity:0}}
#big small{letter-spacing:.14em;color:var(--gold)}
#big h2{font-family:var(--f-mincho);font-weight:800;font-size:30px;letter-spacing:.1em;color:var(--gold2);line-height:1.25;margin:2px 0 6px}
#big p{font-size:14px;line-height:1.8}
/* 城の札 */
#drawer{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:118px;width:330px;max-height:calc(100% - 210px);overflow-y:auto;z-index:5;padding:16px 18px}
.close{position:absolute;right:10px;top:10px}
.ic{width:28px;height:28px;border-radius:3px;border:1px solid var(--rule);background:var(--lac2);font-size:16px;line-height:1;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.eyebrow{display:block;letter-spacing:.12em;color:var(--gold);font-size:11.5px}
.cname{font-family:var(--f-mincho);font-weight:800;font-size:28px;letter-spacing:.06em;line-height:1.15;margin-top:2px}
.cplate{display:inline-block;margin-top:6px;padding:2px 10px;background:var(--c);border:1px solid rgba(255,246,220,.5);font-family:var(--f-mincho);font-weight:800;font-size:13px;color:#fff7e2;border-radius:2px}
.lord{display:flex;align-items:center;gap:12px;margin:14px 0 4px}
.lord b{display:block;font-family:var(--f-mincho);font-size:18px}
img.face{display:block;flex:none;border-radius:50%}
.noface{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 55%,#fff 15%),color-mix(in srgb,var(--c) 70%,#000 30%));border:1.5px solid rgba(233,200,115,.7);font-family:var(--f-mincho);font-weight:800;color:#fff7e2;font-size:13px}
.noface.lg{font-size:24px}.noface.xl{font-size:36px}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 0;font-variant-numeric:tabular-nums}
.stats dt{color:var(--muted);font-size:13px}.stats dd{margin:0}
.glist2{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;margin-top:12px}
.glist2>div{display:flex;align-items:center;gap:7px;font-family:var(--f-mincho);font-weight:700;font-size:13px;min-width:0}
.alert{margin:10px 0 0;padding:7px 10px;border-radius:3px;background:rgba(226,115,91,.13);border:1px solid rgba(226,115,91,.5);color:#f7c6b8;font-size:13px}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:3px;border:1px solid var(--rule2);background:var(--lac2)}
.act b{font-family:var(--f-mincho);font-size:16px;font-weight:800}
.act small{font-size:12px}
.act:hover:not(:disabled){border-color:var(--gold)}
.act:disabled{opacity:.45}
.act.pri{background:linear-gradient(180deg,rgba(217,184,102,.24),rgba(217,184,102,.08));border-color:var(--rule)}
.mini{padding:3px 10px;border-radius:12px;border:1px solid var(--rule);background:var(--lac2);font-size:12px;white-space:nowrap}
.mini.on{border-color:var(--gold);color:var(--gold2)}
.mini:disabled{opacity:.4}
.hint{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.note{margin:12px 0 0;padding:8px 12px;border-left:3px solid var(--gold);background:rgba(217,184,102,.08);font-size:13.5px}
.green{color:var(--green)}
.crest{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);border:1.5px solid rgba(255,246,220,.8);flex:none}
/* 方針 */
.btn{padding:9px 18px;border-radius:3px;border:1px solid var(--rule);background:var(--lac2);font-family:var(--f-mincho);font-weight:800;letter-spacing:.06em}
.btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold2)}
.btn.pri{background:linear-gradient(180deg,#e9cc80,#c9a04e);border-color:#f2dc9c;color:#1d1407}
.btn.pri:hover:not(:disabled){filter:brightness(1.06);color:#1d1407}
.btn:disabled{opacity:.4}
.btn.big{padding:13px 26px;font-size:17px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:58px}
.tt p .ph{display:inline-block}
.btn.big small{font-family:var(--f-body);font-weight:500;font-size:11.5px;letter-spacing:0}
.btn.ghost{background:rgba(19,15,10,.6)}
.btn.wide{width:100%}
#toast{position:absolute;left:50%;top:92px;transform:translate(-50%,-8px);opacity:0;pointer-events:none;z-index:12;padding:8px 18px;font-weight:700;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center;background:var(--lac);border:1px solid var(--gold);border-radius:3px}
#toast.show{opacity:1;transform:translate(-50%,0)}
#news{position:absolute;left:50%;top:14px;z-index:11;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;width:min(440px,calc(100% - 820px))}
#news .nw{display:flex;margin:0 auto;align-items:center;gap:8px;max-width:100%;padding:5px 12px;border-radius:6px;background:rgba(20,14,8,.86);border:1px solid rgba(201,168,92,.55);color:#f2e6c8;font-size:12.5px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.35);animation:nwin .3s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#news .nw.me{border-color:var(--gold)}#news .nw.foe{border-color:var(--red);color:#ffd8cc}
#news .nw i{flex:none;width:10px;height:10px;border-radius:2px;transform:rotate(45deg)}#news .nw small{font-weight:500;opacity:.8}
#news .nw.out{opacity:0;transition:opacity .5s}
@keyframes nwin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

#toast.bad{border-color:var(--red);color:#ffd2c6}#toast.good{border-color:var(--green)}
#tip{position:absolute;z-index:6;pointer-events:none;background:var(--lac);border:1px solid var(--rule);border-radius:3px;padding:7px 11px;display:flex;flex-direction:column;font-size:12px;color:var(--muted);max-width:230px}
#tip b{font-family:var(--f-mincho);font-size:15px;color:var(--paper)}
/* モーダル */
#modal{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,6,4,.5);backdrop-filter:blur(2px)}
.mbox{width:min(560px,100%);max-height:100%;overflow:auto;padding:18px 20px;background:var(--lac);border:1px solid var(--rule);border-radius:4px;box-shadow:inset 0 0 0 3px rgba(19,15,10,.95),inset 0 0 0 4px rgba(217,184,102,.3),0 24px 60px rgba(0,0,0,.55)}
.mbox header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mbox header>div{flex:1;min-width:0}
.mbox header h2{font-family:var(--f-mincho);font-weight:800;font-size:23px;letter-spacing:.06em}
.mbox h3{font-family:var(--f-mincho);font-size:13px;letter-spacing:.12em;color:var(--gold);margin:14px 0 8px}
.mbox footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.mbox .acts{flex-direction:row}.mbox .acts .act{flex:1}
.chat{display:flex;flex-direction:column;gap:8px}
.clog{max-height:44vh;min-height:150px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px;background:rgba(243,232,204,.04);border:1px solid var(--rule2);border-radius:3px}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:92%}
.msg p{padding:7px 11px;border-radius:3px;font-size:13.5px;line-height:1.7;background:var(--lac2);border:1px solid var(--rule2)}
.msg.them p{font-family:var(--f-mincho);font-size:14.5px}
.msg.me{align-self:flex-end}.msg.me p{background:rgba(217,184,102,.14);border-color:var(--rule)}
.sys{align-self:center;font-size:12.5px;color:var(--gold2);border:1px solid var(--rule);border-radius:10px;padding:2px 10px}
.cin{display:flex;gap:8px}
.cin input{flex:1;min-width:0;background:rgba(243,232,204,.06);border:1px solid var(--rule2);border-radius:3px;padding:8px 11px}
.evt{text-align:center;padding:12px 6px 0}
.evt small{letter-spacing:.2em;color:var(--gold)}
.evt h2{font-family:var(--f-mincho);font-weight:800;font-size:36px;letter-spacing:.14em;color:var(--gold2);margin:8px 0 14px}
.evt p{max-width:38ch;margin:0 auto;font-size:15px;line-height:1.9}
.slot{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule2)}
.slot span{flex:1}.slot small{display:block}
.help p{margin:0 0 10px;font-size:13.5px;line-height:1.85;text-align:left}
.help b{font-family:var(--f-mincho);color:var(--gold2);margin-right:4px}
/* 大名選び */
#pick{position:absolute;right:0;top:0;bottom:0;width:400px;z-index:6;overflow-y:auto;padding:22px 22px 30px;background:var(--lac);border-left:1px solid var(--rule)}
.phead h2{font-family:var(--f-mincho);font-weight:800;font-size:26px;letter-spacing:.08em}
.pcur{display:flex;gap:14px;align-items:center;margin:16px 0 14px}
.pcur h2{font-family:var(--f-mincho);font-weight:800;font-size:24px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.pc{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:3px;border:1px solid var(--rule2);background:var(--lac2);text-align:left;min-width:0}
.pc span:not(.crest){font-family:var(--f-mincho);font-weight:800;font-size:14px;line-height:1.25;min-width:0}
.pc small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px}
.pc.on{border-color:var(--gold);background:rgba(217,184,102,.13)}
